name = "feraspizza"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Sito statico (landing, menu, admin) servito dal Worker.
# run_worker_first: ogni richiesta passa dal Worker, che aggiunge
# gli header di sicurezza e gestisce le API prima degli asset.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

# Database D1: creato automaticamente da Cloudflare al primo deploy
# Tabelle e menu iniziale vengono creati da soli alla prima richiesta.
[[d1_databases]]
binding = "DB"
database_name = "feraspizza-db"

# Ritenta ogni 2 minuti le notifiche push non consegnate.
[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true

# Nessun secret obbligatorio:
#  - chiavi notifiche (VAPID) generate e salvate in D1 al primo uso
#  - password iniziale del pannello già impostata (hash in src/lib/auth.js)
# Facoltativi: ADMIN_PASSWORD, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
