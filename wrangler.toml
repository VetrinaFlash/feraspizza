name = "feraspizza"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Sito statico (landing, menu, admin) servito dal Worker.
# run_worker_first: ogni richiesta passa dal Worker, che aggiunge
# gli header di sicurezza e gestisce le API prima degli asset.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

# Database D1: creare una volta con
#   npx wrangler d1 create feraspizza-db
# e incollare qui il database_id restituito.
# Tabelle e menu iniziale vengono creati da soli alla prima richiesta.
[[d1_databases]]
binding = "DB"
database_name = "feraspizza-db"
database_id = "INSERISCI-QUI-IL-DATABASE-ID"

# Ritenta ogni 2 minuti le notifiche push non consegnate.
[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true

# Secret da impostare (Workers → Settings → Variables and Secrets,
# oppure `npx wrangler secret put NOME`):
#   ADMIN_PASSWORD     password iniziale del pannello (utente FERAS)
#   VAPID_PUBLIC_KEY   } generate con: node scripts/generate-vapid.mjs
#   VAPID_PRIVATE_KEY  }
#   VAPID_SUBJECT      es. mailto:email@dominio.it
